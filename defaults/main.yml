---
# Definitions every CenterDevice host gets: one file /etc/logrotate.d/<name> each.
# Set `_logrotate_default_definitions: []` on hosts without them (phoenix).
_logrotate_default_definitions:
  - name: "database_shell"
    logs:
      - "/home/cd-admin/.mysql_history"
      - "/root/.mysql_history"
    options:
      - "daily"
      - "rotate 52"
      - "missingok"
      - "notifempty"
      - "compress"
      - "delaycompress"

# Host-specific definitions, written after the default ones. Keys per entry: name, logs, options and
# the optional script lists postrotate, preremove, lastaction, firstaction.
_logrotate_definitions: []
