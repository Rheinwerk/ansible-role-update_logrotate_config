---
- name: Assert
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Create logrotate configuration files
  ansible.builtin.template:
    src: "etc/logrotate.d/logrotate.j2"
    dest: '/etc/logrotate.d/{{ item.name }}'
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _logrotate_all_definitions }}"
  loop_control:
    label: "{{ item.name }}"
